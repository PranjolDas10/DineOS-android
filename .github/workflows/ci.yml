name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Regenerate Tokens.kt and res/values*/colors.xml from design/tokens.json; fail if a
      # committed copy drifted.
      - run: node design/build-tokens.mjs && git diff --exit-code
      # Generates the API client from contract/openapi.json, compiles, runs JVM unit tests and lint.
      - run: ./gradlew testDebugUnitTest assembleDebug lintDebug --console=plain
